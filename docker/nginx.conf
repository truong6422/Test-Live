# Nginx đứng trước server Bun: một cổng duy nhất cho overlay, admin, API và WebSocket.
# Bật HTTPS: thêm block `listen 443 ssl` với chứng chỉ của bạn và đặt COOKIE_SECURE=true.

# Không ghi query string (chứa ?key= của overlay) vào access log.
log_format sep_nokey '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream sep_server {
  server server:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 256k;
  server_tokens off;

  access_log /var/log/nginx/access.log sep_nokey;

  location /ws/ {
    proxy_pass http://sep_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    proxy_pass http://sep_server;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
